# A/B benchmark: k-means IVF vs stock k-pool DSA indexer.
# Two cases (kpool, ivf); `sweeps` flip one knob on ivf for the ablations.

model: /model/GLM-5.3-Flash
gpu: "H200:4"

image:
  from_fork: /home/yhosmane/vishal-vllm/vllm   # build the fork so IVF code is present

# Fixed for every run; only the indexer (and swept knob) differs.
fairness:
  greedy: true
  seed: 0
  max_tokens: 16384
  max_model_len: 34000
  prefix_caching: off        # IVF forces off; match on kpool

# Failure handling for both runners. A failed request is retried, then its run
# or cell is skipped and retried on a later pass in the same job; requeued jobs
# resume from their checkpoints. The backoff lets a storage blip drain.
resilience:
  request_attempts: 3
  run_passes: 4
  pass_backoff_s: 300

# serve_level needs a server restart; free axes run inside one serve.
axes:
  serve_level: [indexer, P, clusters, cadence, concurrency, exec_mode]
  free: [dataset, task, length, n]

# The two arms: k-means off vs on.
indexer_arms:
  kpool:
    env: {VLLM_ENABLE_DSA_IVF_INDEXER: 0}
  ivf:
    env: {VLLM_ENABLE_DSA_IVF_INDEXER: 1}
    # Base counts; the ivf case overrides them (see below).
    hf_overrides: {index_num_clusters: 64, index_num_probes: 8}

# Free axes. Each carries its own accuracy metric.
datasets:
  ruler:
    metric: recall
    lengths: [4096, 8192, 16384]
    n: 20
    tasks: [niah_single_1, niah_single_2, niah_single_3,
            niah_multikey_1, niah_multikey_2, niah_multikey_3,
            niah_multivalue, niah_multiquery, vt, cwe, fwe, qa_1, qa_2]
  swebench:
    metric: resolved_pct
    subset: verified_lite
    harness: agentic
  regression:
    metric: accuracy
    tasks: [gsm8k, mmlu]

# Metric definitions. Which ones a run produces is decided by run type in
# bench_config.py (Run.metrics()), not here.
metrics:
  accuracy: per_task_and_mean
  latency_ttft: [prefill_ttft_ms, decode_ms, decode_tok_s]
  throughput: aggregate_tok_s
  peak_indexer_mib: per_rank
  resident_state_mib: per_rank
  per_layer_indexer_ms:
    layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43]
    prefill_split: [cluster, assign_score]   # IVF only
  lost_attention: [key_lost, mass_lost]       # IVF only; fractions dropped vs exact top-k

# The default run: the shared operating point both arms start from. Each case
# below references it with `<<: *default` and overrides only what differs, so the
# base kpool/ivf pair is apples-to-apples (same config, k-means off vs on).
default: &default
  P: null
  clusters: null
  cadence: null
  concurrency: 1
  exec_mode: eager
  measure_lost_attention: false
  datasets: [ruler]           # ruler-only for now (regression/swebench deferred)

# The two cases. `<<: *default` pulls the default run; list only the diffs.
# `sweep` on a case adds ablation runs: one knob flipped per value (-> [ruler],
# id like ivf_P_64). `with` overrides extra fields on those runs.
runs:
  - id: kpool                 # without k-means
    <<: *default
    indexer: kpool
    sweep: # mirror the ivf throughput grid so the arms compare at equal load
      throughput_grid:
        with: {exec_mode: graph, measure_lost_attention: false}
        cells:        # kpool has no indexer knobs; only length x concurrency
          - {length: 16384,  concurrency: [1, 4, 16, 64, 256]}
          - {length: 65536,  concurrency: [1, 4, 16, 64]}
          - {length: 131072, concurrency: [1, 4, 16]}

  - id: ivf                   # with k-means (base operating point)
    <<: *default
    indexer: ivf
    # Aligned to the fidelity grid's rule: clusters = round(sqrt(L/4)) sized for
    # the longest ruler length this serve handles (16384 -> 64); probes = 12.5%
    # of clusters (-> 8), the same probed fraction as the former 256/32 base.
    clusters: 64
    P: 8
    measure_lost_attention: true
    sweep: # ablations on the ivf run. throughput_grid = throughput vs
           # (length x concurrency) in graph mode; cells = the per-length
           # clusters/probes lost-attention grid (slurm runner).
      # Throughput at IVF's real per-length operating point: clusters =
      # round(sqrt(length/4)), probes = 12.5% of clusters (same rule as the
      # fidelity grid). The ladder tapers at long context because KV memory
      # caps concurrency. max_model_len is derived as length + max_tokens.
      throughput_grid:
        with: {exec_mode: graph, measure_lost_attention: false}
        cells:
          - {length: 16384,  clusters: 64,  probes: 8,  concurrency: [1, 4, 16, 64, 256]}
          - {length: 65536,  clusters: 128, probes: 16, concurrency: [1, 4, 16, 64]}
          - {length: 131072, clusters: 181, probes: 23, concurrency: [1, 4, 16]}
      # IVF lost-attention fidelity sweep, run by slurm/lost_attention_run.py
      # (not the A/B matrix). One serve per (length, probe); every task in the
      # ruler dataset runs through each serve (tasks are a free axis), n samples
      # each. Every operating point is explicit -- nothing is computed at run
      # time. Derived as clusters = round(sqrt(length/4)) = sqrt(#pools)
      # (kpool=4), probes = round(clusters * {6.25,12.5,25,50,75}%).
      cells:
        n: 20                   # samples per task per cell; `all` = whole file
        concurrency: 32         # requests in flight; server batches them
        tasks: all              # all tasks listed in the ruler dataset above
        grid:
          - {length: 8192,   clusters: 45,  probes: [3, 6, 11, 23, 34]}
          - {length: 16384,  clusters: 64,  probes: [4, 8, 16, 32, 48]}
          - {length: 32768,  clusters: 91,  probes: [6, 11, 23, 46, 68]}
          - {length: 65536,  clusters: 128, probes: [8, 16, 32, 64, 96]}
          - {length: 131072, clusters: 181, probes: [11, 23, 45, 91, 136]}
